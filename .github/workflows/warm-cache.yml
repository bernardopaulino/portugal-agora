name: Aquecer a cache

# Só à mão (Actions → "Aquecer a cache" → Run workflow). Visita todas as
# páginas e imagens de partilha para a CDN deixar de servir versões antigas.
# Cada passagem custa ~300 renovações ISR de 170–300 KB cada (contadas em
# unidades de 8 KB), por isso já não corre sozinha: o limite de "ISR writes"
# do plano Hobby chegava ao fim. O carimbo "A atualizar os dados…" e o
# /api/state cobrem os dados antigos no browser. Ver scripts/warm-cache.mjs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/warm-cache.mjs https://portugalagora.pt
