name: Aquecer a cache

# De 6 em 6 horas, visita todas as páginas e imagens de partilha. Uma página
# que ninguém visitou durante muito tempo ainda é a última versão gerada
# (às vezes a do build, com dias); a visita dispara a renovação, por isso
# o HTML que a CDN entrega nunca tem mais de ~6 h. Custa ~300 renovações
# ISR por passagem (~36 mil/mês; limite Hobby: 200 mil). Ver
# scripts/warm-cache.mjs.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/warm-cache.mjs https://portugalagora.pt
