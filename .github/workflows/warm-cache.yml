name: Aquecer a cache

# Depois de cada deploy de produção, visita todas as páginas para a CDN
# não entregar o HTML do build (com os dados da hora do deploy). Ver
# scripts/warm-cache.mjs.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A CDN pode ainda estar a propagar o deploy novo.
      - run: sleep 30

      - run: node scripts/warm-cache.mjs https://portugalagora.pt
