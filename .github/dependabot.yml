# Avisa (com um pull request) quando há versões novas ou falhas de segurança
# nas dependências. As atualizações pequenas vêm juntas, para não encher a lista.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Versões principais que esperam por decisão: @types/node acompanha o Node
    # da Vercel e da CI (22); TypeScript 7 e ESLint 10 esperam que o Next os
    # suporte. As correções de segurança chegam na mesma.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
